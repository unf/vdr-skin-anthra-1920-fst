# Options for the anthra_1920_FSt skin (VDR text2skin plugin), make syntax.
# After changes run: vdr-skin-anthra-update anthra_1920_FSt
# and restart VDR. Escape slashes in paths with backslashes.

###### SKINOPTIONS:

##### to comment an option just place a '#' at the beginning of the line
##### to uncomment an option please remove the leading '#'
##### !!! Take care to uncomment only ONE option in each section !!!

##### CHANNELLOGOS ######
#NOLOGOS = 1
LOGOSRIGHT = 1
#LOGOSLEFT = 1

###### path to the channellogos, escape slashes with backslashes! ######
###### e.g. CHANNELLOGOSPATH = \/etc\/vdr\/plugins\/text2skin\/liquid-logos4anthra_HD #####
CHANNELLOGOSPATH =  \/var\/lib\/vdr\/channellogos

##### SEPARATORLOGOS ######
#SEPARATORLOGOS-LEFT = 1
SEPARATORLOGOS-RIGHT = 1

###### path to the channellogos, escape slashes with backslashes! ######
###### e.g. SEPARATORLOGOSPATH = ..\/liquid-logos4separator #####
SEPARATORLOGOSPATH = ..\/liquid-logos4separator

###### MENULOGOS  #####
MENULOGOS = 1

###### EPGIMAGES ######
EPGIMAGES = 1

###### path to the epgimages, escape slashes with backslashes! ######
###### e.g. EPGIMAGESPATH=\/etc\/vdr\/plugins\/tvm2vdr\/epgimages ######
EPGIMAGESPATH = \/var\/cache\/vdr\/epgimages

###### EPGIMAGESFORMAT #####
####### default EPGIMAGESFORMAT is png, uncomment the following line, if you have jpgs ######
#EPGIMAGESJPG = 1

###### RECORDINGIMAGES #####
###### Filename of RECORDINGIMAGE
RECORDINGIMAGES = 1
RECORDINGIMAGENAME = thumbnail

###### TIMER-INFO_MAIN-MENU ######
TIMER-INFO_MAIN-MENU = 1
RUNNING_TIMER_BLINK = 1

###### MAINMENUFONTS ######
#SMALLMENUFONT = 1
DEFAULTMENUFONT = 1
#LARGEMENUFONT = 1
###

##### SIGNAL ######
#DIGIT_SIGNAL = 1
GRAPH_SIGNAL = 1

###### SUBMENU_DIVIDER ######
###### for divider between submenu-items
SUBMENU_DIVIDER = 1

###### SCROLLBAR <--> SCROLLARROWS ######
#SCROLLBAR = 1
SCROLLARROWS = 1

